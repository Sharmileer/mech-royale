name: Bot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Behavioral tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Build pinned amd64 container
        run: docker build --platform linux/amd64 -t oval-sentinel .
      - name: Official sandbox conformance
        run: >-
          python3 -B check/check.py --map-dir /arena --
          docker run --rm -i --network none --cpus 1 --memory 512m
          --read-only --tmpfs /tmp:rw,size=64m --user 65534:65534
          -v "$PWD/arena:/arena:ro" oval-sentinel
      - name: Check submission size
        run: python3 tools/repo_size.py
